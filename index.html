<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pastelería de Papoi</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0500;}
#c{position:absolute;inset:0;width:100%;height:100%;}
#ui{position:absolute;inset:0;pointer-events:none;}

#topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:linear-gradient(180deg,rgba(10,3,0,.82) 0%,transparent 100%);pointer-events:none;}
.hbox{text-align:center;}
.hlbl{font-size:9px;font-weight:800;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:1.2px;}
.hval{font-family:'Fredoka One',cursive;font-size:26px;color:#FFD54F;text-shadow:0 0 18px #FF8F00,2px 2px 0 rgba(0,0,0,.55);line-height:1;}
.lpill{background:linear-gradient(135deg,#FF6F00,#FFB300);border-radius:24px;padding:5px 16px;font-family:'Fredoka One',cursive;font-size:13px;color:#fff;box-shadow:0 4px 14px rgba(255,140,0,.45),inset 0 1px 0 rgba(255,255,255,.25);}
.xpw{height:5px;background:rgba(255,255,255,.12);border-radius:4px;margin-top:4px;overflow:hidden;width:105px;margin:4px auto 0;}
#xpBar{height:100%;background:linear-gradient(90deg,#FFB300,#FF6F00);border-radius:4px;width:0%;transition:width .6s;}

#ordersPanel{position:absolute;top:66px;left:10px;display:flex;flex-direction:column;gap:6px;pointer-events:all;}
.ocard{background:rgba(255,253,240,.95);border-radius:14px;border:2.5px solid #E8B86D;padding:8px 10px;cursor:pointer;transition:all .2s;width:140px;box-shadow:0 4px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.8);}
.ocard:hover,.ocard.sel{border-color:#E8453C;background:rgba(255,245,235,.98);transform:translateX(5px);box-shadow:0 6px 24px rgba(232,69,60,.38);}
.orow{display:flex;align-items:center;gap:7px;}
.ocust{font-size:24px;}
.oinfo{flex:1;min-width:0;}
.oname{font-size:9px;font-weight:800;color:#8B4513;line-height:1.3;}
.tbg{height:4px;background:#E8C97A;border-radius:4px;margin-top:4px;overflow:hidden;}
.tb{height:100%;border-radius:4px;transition:width .12s linear,background .6s;}
.ttime{font-size:8px;color:#A07040;font-weight:700;margin-top:2px;}

#stepPanel{position:absolute;top:66px;right:10px;width:165px;pointer-events:all;}
.scard{background:rgba(255,253,240,.95);border-radius:14px;border:2.5px solid #E8B86D;padding:11px 12px;margin-bottom:6px;box-shadow:0 4px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.8);}
.stitle{font-family:'Fredoka One',cursive;font-size:13px;color:#C0600A;margin-bottom:8px;}
.sitem{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:9px;margin-bottom:3px;border:1.5px solid transparent;transition:all .22s;}
.sitem.cur{background:rgba(232,69,60,.13);border-color:#E8453C;}
.sitem.done{background:rgba(76,175,80,.1);border-color:#4CAF50;opacity:.78;}
.snum{width:21px;height:21px;border-radius:50%;background:#E8B86D;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;flex-shrink:0;}
.sitem.cur .snum{background:#E8453C;} .sitem.done .snum{background:#4CAF50;}
.stxt{font-size:9.5px;font-weight:700;color:#6B3A1F;flex:1;line-height:1.3;}
.ctag{background:linear-gradient(135deg,#7B1FA2,#E040FB);border-radius:20px;padding:2px 11px;font-family:'Fredoka One',cursive;font-size:11px;color:#fff;display:inline-block;margin-bottom:6px;box-shadow:0 3px 10px rgba(156,39,176,.4);}

#phaseBox{position:absolute;top:66px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:5;}
#phaseLbl{background:rgba(10,3,0,.72);color:rgba(255,248,210,.95);font-size:13px;font-weight:800;padding:7px 22px;border-radius:24px;white-space:nowrap;border:1px solid rgba(255,200,100,.2);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s;display:inline-block;}
#phaseLbl.show{opacity:1;}

#progWrap{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);width:320px;text-align:center;pointer-events:none;display:none;}
.pblbl{font-size:11px;font-weight:800;color:rgba(255,248,200,.85);margin-bottom:5px;letter-spacing:.4px;}
.pbbg{height:11px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.35);}
#pbFill{height:100%;background:linear-gradient(90deg,#FFB300,#FF6F00,#E8453C);border-radius:8px;box-shadow:0 0 14px rgba(255,150,0,.65);transition:width .18s ease;width:0%;}

#actionBtn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);pointer-events:all;border:none;border-radius:24px;border-bottom:5px solid transparent;padding:15px 46px;font-family:'Fredoka One',cursive;font-size:20px;cursor:pointer;transition:all .15s;letter-spacing:.5px;white-space:nowrap;box-shadow:0 0 0 3px rgba(255,255,255,.08);}
#actionBtn.cook{background:linear-gradient(135deg,#E8453C,#FF7043);color:#fff;border-bottom-color:#B71C1C;box-shadow:0 8px 34px rgba(232,69,60,.55),0 0 60px rgba(232,69,60,.1);}
#actionBtn.cook:hover{transform:translateX(-50%) translateY(-3px);} #actionBtn.cook:active{transform:translateX(-50%) translateY(2px);border-bottom-width:2px;}
#actionBtn.serve{background:linear-gradient(135deg,#1B5E20,#43A047);color:#fff;border-bottom-color:#1B5E20;box-shadow:0 8px 34px rgba(67,160,71,.5);}
#actionBtn.serve:hover{transform:translateX(-50%) translateY(-3px);}
#actionBtn.idle{background:linear-gradient(135deg,#4E342E,#6D4C41);color:rgba(255,255,255,.45);border-bottom-color:#3E2723;box-shadow:none;cursor:default;}
#actionBtn.neword{background:linear-gradient(135deg,#0D47A1,#1976D2);color:#fff;border-bottom-color:#0D47A1;box-shadow:0 8px 28px rgba(25,118,210,.45);}
#actionBtn.neword:hover{transform:translateX(-50%) translateY(-2px);}

#speechWrap{position:absolute;bottom:98px;right:14px;pointer-events:none;transition:opacity .3s;}
.sb{background:#fff;border:3px solid #E8453C;border-radius:18px;padding:9px 13px;font-size:11px;font-weight:800;color:#E8453C;max-width:164px;line-height:1.45;text-align:center;box-shadow:3px 3px 0 rgba(232,69,60,.2),0 6px 24px rgba(0,0,0,.28);}
.sb::after{content:'';position:absolute;bottom:-11px;right:24px;border:5px solid transparent;border-top-color:#E8453C;}

.ibtn{position:absolute;top:66px;pointer-events:all;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.16);border-radius:50%;width:37px;height:37px;font-size:15px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s;backdrop-filter:blur(5px);}
.ibtn:hover{background:rgba(255,255,255,.2);}
#audioBtn{right:10px;} #newBtn{right:55px;font-family:'Fredoka One',cursive;font-size:14px;}

#modOverlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(12px);}
#modOverlay.show{opacity:1;pointer-events:all;}
.mbox{background:linear-gradient(145deg,#FFF9EE,#FFF1D0);border-radius:28px;border:4px solid #E8453C;padding:28px 38px;text-align:center;max-width:290px;width:90%;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 8px rgba(232,69,60,.1),8px 8px 0 #C0302A;animation:mPop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes mPop{0%{transform:scale(.12)rotate(-14deg);opacity:0;}100%{transform:scale(1)rotate(0);opacity:1;}}
.mej{font-size:68px;display:block;margin-bottom:7px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));}
.mtit{font-family:'Fredoka One',cursive;font-size:28px;color:#E8453C;margin-bottom:4px;}
.mmsg{font-size:13px;font-weight:700;color:#8B4513;margin-bottom:9px;line-height:1.5;}
.mpts{font-family:'Fredoka One',cursive;font-size:50px;color:#FF8F00;display:block;margin-bottom:14px;text-shadow:2px 2px 0 rgba(0,0,0,.1);}
.mbtn{background:linear-gradient(135deg,#E8453C,#FF6B6B);color:#fff;border:none;border-bottom:4px solid #A02020;border-radius:15px;padding:11px 28px;font-family:'Fredoka One',cursive;font-size:17px;cursor:pointer;transition:all .15s;}
.mbtn:hover{transform:translateY(-2px);}

#startScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;z-index:60;}
.startscat{font-size:90px;filter:drop-shadow(0 0 30px rgba(255,180,0,.7));animation:catBob 2.2s ease-in-out infinite;}
@keyframes catBob{0%,100%{transform:translateY(0)rotate(-2deg);}50%{transform:translateY(-13px)rotate(2deg);}}
.startTitle{font-family:'Fredoka One',cursive;font-size:42px;color:#FFD54F;text-shadow:0 0 44px #FF8F00,4px 4px 0 #8B4513;text-align:center;line-height:1.07;}
.startSub{font-size:13px;font-weight:700;color:rgba(255,255,255,.65);text-align:center;max-width:280px;line-height:1.65;}
.startBtn{background:linear-gradient(135deg,#E8453C,#FF6B6B);color:#fff;border:none;border-bottom:6px solid #A02020;border-radius:20px;padding:16px 56px;font-family:'Fredoka One',cursive;font-size:26px;cursor:pointer;box-shadow:0 12px 44px rgba(232,69,60,.72);transition:all .15s;pointer-events:all;}
.startBtn:hover{transform:translateY(-4px);} .startBtn:active{transform:translateY(2px);border-bottom-width:3px;}

.dp{position:fixed;pointer-events:none;z-index:200;font-size:22px;animation:pFly 1.7s ease-out forwards;}
@keyframes pFly{0%{opacity:1;transform:translate(0,0)rotate(0)scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty))rotate(var(--tr))scale(.04);}}

#loader{position:absolute;inset:0;background:#0a0400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:70;}
.ldcat{font-size:80px;animation:catBob 1.2s ease-in-out infinite;}
.ldtxt{font-family:'Fredoka One',cursive;font-size:20px;color:#FFD54F;}
.ldbg{width:220px;height:10px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;}
.ldfill{height:100%;background:linear-gradient(90deg,#E8453C,#FFB300);border-radius:8px;animation:ldA 2.2s ease forwards;}
@keyframes ldA{0%{width:0%}100%{width:100%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="topbar">
    <div class="hbox"><div class="hlbl">Puntuación</div><div class="hval" id="scoreD">0</div></div>
    <div class="hbox"><div class="lpill" id="lvlD">🍳 Novato</div><div class="xpw"><div id="xpBar"></div></div></div>
    <div class="hbox"><div class="hlbl">Servidos</div><div class="hval" id="servD" style="color:#A5D6A7;font-size:20px;">0</div></div>
  </div>
  <button class="ibtn" id="audioBtn">🔊</button>
  <button class="ibtn" id="newBtn">+</button>
  <div id="ordersPanel"></div>
  <div id="stepPanel"></div>
  <div id="phaseBox"><span id="phaseLbl"></span></div>
  <div id="progWrap"><div class="pblbl" id="pbLbl">Cocinando...</div><div class="pbbg"><div id="pbFill"></div></div></div>
  <button id="actionBtn" class="idle">Cargando...</button>
  <div id="speechWrap"><div class="sb" id="speech">¡Hola! Soy Chef Jared 🐾</div></div>
  <div id="modOverlay"><div class="mbox">
    <span class="mej" id="mEj">🎂</span><div class="mtit" id="mTit">¡PERFECTO!</div>
    <div class="mmsg" id="mMsg">¡Te amo! </div><span class="mpts" id="mPts">+200</span>
    <button class="mbtn" id="modalClose">¡Seguir horneando! 🎂</button>
  </div></div>
  <div id="startScreen">
    <div class="startscat">🐱</div>
    <div class="startTitle">PASTELERÍA<br>DE PAPOI</div>
    <button class="startBtn" id="startBtn">¡Jugar! 🎂</button>
  </div>
  <div id="loader"><div class="ldcat">🐱</div><div class="ldtxt">Calentando la pastelería...</div><div class="ldbg"><div class="ldfill"></div></div></div>
</div>

<script>
// ═══ CORE ════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
const easeOut=t=>1-(1-t)*(1-t);
const easeInOut=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const rand=(a,b)=>a+(b-a)*Math.random();
const randInt=(a,b)=>Math.floor(rand(a,b+1));

// ═══ CANVAS ══════════════════════════════════════════════════
const canvas=$('c'), C=canvas.getContext('2d');
let W,H;
const resize=()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;};
resize(); window.addEventListener('resize',resize);

// ═══ AUDIO ═══════════════════════════════════════════════════
const SFX=(()=>{
  let ctx=null,master=null,on=true;
  const init=()=>{try{ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);}catch(e){}};
  const resume=()=>{if(ctx&&ctx.state==='suspended')ctx.resume();};
  const noise=d=>{if(!ctx)return null;const s=ctx.sampleRate,b=ctx.createBuffer(1,Math.ceil(s*d),s),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;return b;};
  const osc=(freq,dur,type='sine',vol=.2,delay=0)=>{if(!ctx||!on)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;const t=ctx.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1);};
  const band=(dur,freq,q,vol,atk=.3)=>{if(!ctx||!on)return;const b=noise(dur+.5);if(!b)return;const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const t=ctx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.linearRampToValueAtTime(vol,t+dur-.5);g.gain.linearRampToValueAtTime(0,t+dur);src.connect(f);f.connect(g);g.connect(master);src.start();};
  return{
    init,resume,
    toggle(){on=!on;return on;},
    click(){osc(800,.07,'square',.06);},
    drop(){if(!ctx||!on)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(300,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(60,ctx.currentTime+.14);g.gain.setValueAtTime(.28,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+.2);},
    sizzle(){band(.18,800,3,.06,.01);},
    creak(){if(!ctx||!on)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,ctx.currentTime);o.frequency.linearRampToValueAtTime(110,ctx.currentTime+.45);g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.linearRampToValueAtTime(0,ctx.currentTime+.45);o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+.5);},
    stepDone(){osc(660,.18,'sine',.22);setTimeout(()=>osc(880,.28,'sine',.18),120);},
    success(){[[523,0],[659,.1],[784,.2],[1047,.32],[1319,.44],[1568,.56]].forEach(([f,d])=>{osc(f,.5,'sine',.22,d);osc(f*.5,.5,'sine',.07,d);});},
    mixing(d){band(d,300,2.5,.08,.3);},
    whisk(d){if(!ctx||!on)return;const o=ctx.createOscillator(),lfo=ctx.createOscillator(),lg=ctx.createGain(),f=ctx.createBiquadFilter(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=210;lfo.frequency.value=16;lg.gain.value=100;lfo.connect(lg);lg.connect(o.frequency);f.type='highpass';f.frequency.value=380;const t=ctx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.45);g.gain.linearRampToValueAtTime(.11,t+d-.5);g.gain.linearRampToValueAtTime(0,t+d);o.connect(f);f.connect(g);g.connect(master);o.start();lfo.start();o.stop(t+d);lfo.stop(t+d);},
    oven(d){band(d,160,1.2,.16,1.2);setTimeout(()=>{osc(1047,.4,'sine',.28);setTimeout(()=>osc(1319,.55,'sine',.22),160);},(d-.8)*1000);},
    bgm(){if(!ctx||!on)return;const m=[[523,.4],[587,.4],[659,.4],[523,.4],[659,.8],[784,.8],[659,.4],[587,.4],[523,.8],[523,.4],[784,.4],[880,.8],[784,.4],[659,.8]];let t=0;m.forEach(([f,d])=>{osc(f,d*.8,'sine',.055,t);osc(f*.5,d*.7,'sine',.028,t);t+=d;});setTimeout(()=>this.bgm(),t*1000+4200);}
  };
})();

// ═══ DRAW HELPERS ════════════════════════════════════════════
const rr=(x,y,w,h,r)=>{C.beginPath();C.moveTo(x+r,y);C.lineTo(x+w-r,y);C.quadraticCurveTo(x+w,y,x+w,y+r);C.lineTo(x+w,y+h-r);C.quadraticCurveTo(x+w,y+h,x+w-r,y+h);C.lineTo(x+r,y+h);C.quadraticCurveTo(x,y+h,x,y+h-r);C.lineTo(x,y+r);C.quadraticCurveTo(x,y,x+r,y);C.closePath();};
const lg=(x1,y1,x2,y2,stops)=>{const g=C.createLinearGradient(x1,y1,x2,y2);stops.forEach(([t,c])=>g.addColorStop(t,c));return g;};
// rg handles: (cx,cy,r0,r1[,stops]) 4-5 args, OR (x0,y0,r0,x1,y1,r1[,stops]) 6-7 args
// Also supports .addColorStop() chaining after calling with no stops array
const rg=(...a)=>{
  const stArr=a.find(x=>Array.isArray(x))||[];
  const nums=a.filter(x=>!Array.isArray(x));
  let g;
  if(nums.length>=6) g=C.createRadialGradient(nums[0],nums[1],nums[2],nums[3],nums[4],nums[5]);
  else g=C.createRadialGradient(nums[0],nums[1],nums[2]||0,nums[0],nums[1],nums[3]||50);
  stArr.forEach(([t,c])=>g.addColorStop(t,c));
  return g;
};
const sh=(b,c)=>{C.shadowBlur=b;C.shadowColor=c;};
const ns=()=>{C.shadowBlur=0;C.shadowColor='transparent';};
function shiftColor(hex,amt){if(hex&&hex.startsWith('#')){const n=parseInt(hex.slice(1),16)||0;return`rgb(${Math.max(0,Math.min(255,((n>>16)&255)+amt))},${Math.max(0,Math.min(255,((n>>8)&255)+amt))},${Math.max(0,Math.min(255,(n&255)+amt))})`;} return hex||'#f5deb3';}
function lerpc(a,b,t){const pa=parseInt((a||'f5deb3').replace('#',''),16)||0,pb=parseInt((b||'f5deb3').replace('#',''),16)||0;return`rgb(${Math.round(lerp((pa>>16)&255,(pb>>16)&255,t))},${Math.round(lerp((pa>>8)&255,(pb>>8)&255,t))},${Math.round(lerp(pa&255,pb&255,t))})`;}
function toHex(n){return'#'+('000000'+(n>>>0).toString(16)).slice(-6);}

// ═══ PARTICLES ═══════════════════════════════════════════════
const PARTS=[];
const addP=(x,y,vx,vy,col,r,life,grav=.12,shape='circle')=>PARTS.push({x,y,vx,vy,col,r,life,maxLife:life,grav,shape,rot:rand(0,Math.PI*2),rv:rand(-.1,.1)});
const flour=(x,y,n=10)=>{for(let i=0;i<n;i++)addP(x+rand(-50,50),y+rand(-20,10),rand(-2,2),rand(-3.5,-1),'rgba(255,255,255,.9)',rand(2,7),rand(.55,.85),.09);};
const steam=(x,y)=>{const g=Math.round(210+Math.random()*40);addP(x+rand(-14,14),y,rand(-.5,.5),rand(-2.8,-1.8),`rgba(${g},${g},${g},.6)`,rand(7,18),rand(.9,1.5),-.004);};
const sparkle=(x,y,c='#ffd700')=>{for(let i=0;i<10;i++){const a=i/10*Math.PI*2;addP(x,y,Math.cos(a)*rand(1.5,5.5),Math.sin(a)*rand(1.5,5.5)-1.5,c,rand(2,5.5),rand(.4,.75),.06,'star');}};
const confetti=(x,y)=>{const cols=['#ff4455','#44ff88','#4488ff','#ffcc00','#ff44cc','#44ffff','#ff8800'];for(let i=0;i<32;i++)addP(x+rand(-100,100),y+rand(-50,50),rand(-6,6),rand(-10,-2),cols[randInt(0,cols.length-1)],rand(4,10),rand(.8,1.5),.15,'rect');};
function updateParticles(){for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.978;p.rot+=p.rv;p.life-=.016;if(p.life<=0)PARTS.splice(i,1);}}

// ═══ KITCHEN ═════════════════════════════════════════════════
// Drawn directly each frame — no offscreen cache complexity
function drawKitchen(){
  const cY=H*.67, cH=H*.13; // counter top Y, height

  // ── Atmosphere behind everything ──
  C.fillStyle=lg(0,0,0,H,[[0,'#120400'],[.4,'#1a0800'],[1,'#0a0200']]);
  C.fillRect(0,0,W,H);

  // ── WALL — warm plaster with soft depth ──
  C.fillStyle=lg(0,0,0,cY,[[0,'#f0e0c4'],[.35,'#eddbbc'],[.7,'#e8d4b0'],[1,'#e0cca0']]);
  C.fillRect(0,0,W,cY);
  // Warm ambient occlusion at room corners
  C.fillStyle=rg(0,0,0,0,cY*.5,W*.45,[[0,'rgba(80,40,0,.1)'],[1,'transparent']]);
  C.fillRect(0,0,W*.45,cY);

  // ── TILE WAINSCOTING ──
  const tS=Math.round(Math.min(48,W/18)); // tile size
  const tilesY=cY-tS*4.5;
  C.save();
  for(let tx=0;tx<=W;tx+=tS){
    for(let ty=Math.floor(tilesY/tS)*tS;ty<cY;ty+=tS){
      const il=(Math.floor(tx/tS)+Math.floor((ty-tilesY)/tS))%2===0;
      C.fillStyle=il?'rgba(255,252,242,.87)':'rgba(238,228,205,.7)';
      rr(tx+1.5,ty+1.5,tS-3,tS-3,2);C.fill();
      // Gloss
      C.fillStyle='rgba(255,255,255,.12)';rr(tx+3,ty+3,tS-6,tS*.28,1);C.fill();
      // Grout
      C.strokeStyle='rgba(170,148,110,.22)';C.lineWidth=.8;C.beginPath();C.rect(tx+.5,ty+.5,tS-1,tS-1);C.stroke();
    }
  }
  C.restore();

  // ── UPPER CABINETS ──
  const ucH=H*.19;
  C.fillStyle=lg(0,0,0,ucH,[[0,'#8b5520'],[.5,'#7a4818'],[1,'#6b3c12']]);
  C.fillRect(0,0,W,ucH);
  // Bottom trim
  C.fillStyle=lg(0,ucH-7,0,ucH+5,[[0,'#5d3010'],[1,'#3d1a04']]);C.fillRect(0,ucH-7,W,12);
  // Cabinet doors
  const nUD=Math.ceil(W/200);
  for(let d=0;d<nUD;d++){
    const dx=d*(W/nUD),dw=W/nUD-2,dy=4,dh=ucH-12;
    C.fillStyle=lg(dx,dy,dx,dy+dh,[[0,'#a86030'],[.4,'#9a5528'],[1,'#8a4820']]);
    rr(dx+4,dy,dw,dh,5);C.fill();
    // Glass sheen + panel inset
    C.fillStyle='rgba(255,255,255,.06)';rr(dx+6,dy+2,dw-4,10,3);C.fill();
    C.strokeStyle='rgba(55,28,8,.35)';C.lineWidth=1.2;rr(dx+10,dy+8,dw-14,dh-16,4);C.stroke();
    C.fillStyle='rgba(0,0,0,.05)';rr(dx+11,dy+9,dw-16,dh-18,3);C.fill();
    // Knob
    const kx=dx+dw*.5,ky=dy+dh*.6;
    sh(4,'rgba(0,0,0,.35)');
    const kg=rg(kx-2,ky-2,0,kx+2,ky+2,6,[[0,'#d4a050'],[.6,'#a07030'],[1,'#6b4818']]);
    C.fillStyle=kg;C.beginPath();C.arc(kx,ky,5.5,0,Math.PI*2);C.fill();ns();
    C.fillStyle='rgba(255,210,120,.4)';C.beginPath();C.arc(kx-1.5,ky-1.5,2,0,Math.PI*2);C.fill();
  }

  // ── WINDOW ──
  const wX=W*.38,wY=H*.06,wW=Math.min(220,W*.24),wH=H*.2;
  // Frame
  sh(14,'rgba(0,0,0,.45)');
  C.fillStyle=lg(wX-9,wY,wX-9,wY+wH+18,[[0,'#d4904a'],[.5,'#c07c38'],[1,'#a86828']]);

function initMix(step){

  const a=animState;

  if(p>.58){const sp=(p-.58)/.42;a.spoonAng=sp*Math.PI*16;if(Math.random()<.18){const ang=Math.random()*Math.PI*2;a.bubbles.push({x:W*.5+Math.cos(ang)*62,y:H*.5+Math.sin(ang)*27,vy:rand(-2,-1),life:1,r:rand(3,9)});}}

  const a=animState;drawWorkSurface();
  if(p<.58){
    sh(4,'rgba(0,0,0,.15)');C.fillStyle=lg(W*.06,H*.22,W*.06,H*.62,[[0,'#c8945a'],[1,'#a06830']]);rr(W*.06,H*.22,W*.18,H*.4,8);C.fill();ns();

    a.ings.slice(a.dropped).forEach((ing,i)=>{C.save();C.translate(W*.15,H*.28+i*44);C.globalAlpha=.72;ing.draw(0,0);C.restore();});}
  const fc=lerpc('#f5deb3',a.targetColor,Math.max(0,(p-.55)/.38));

  a.drops.forEach(d=>{if(!d.landed)return;const fade=Math.max(0,1-Math.max(0,(p-.58)/.22));C.save();C.globalAlpha=fade*.88;C.translate(d.x,d.y);d.draw(0,0);C.restore();});

    C.fillStyle=irG;C.beginPath();C.ellipse(ex,ey,7.5,7.5*blinkH,0,0,Math.PI*2);C.fill();
    // Primary catchlight
    C.fillStyle='rgba(255,255,255,.9)';C.beginPath();C.arc(ex+3,ey-3,2.8,0,Math.PI*2);C.fill();
    // Secondary catchlight
    C.fillStyle='rgba(255,255,255,.5)';C.beginPath();C.arc(ex-2,ey+2,1.4,0,Math.PI*2);C.fill();
    // Pupil gloss
    const pgG=rg(ex,ey-2,0,ex,ey-1,4);pgG.addColorStop(0,'rgba(80,80,120,.3)');pgG.addColorStop(1,'transparent');
    C.fillStyle=pgG;C.beginPath();C.ellipse(ex,ey,7.5,7.5*blinkH,0,0,Math.PI*2);C.fill();
    // Blush
    C.fillStyle=`rgba(255,143,171,${.42+Math.sin(t)*.05})`;
    C.beginPath();C.ellipse(ex+(ei===0?-13:13),ey+9,9.5,5.5,0,0,Math.PI*2);C.fill();
  });

  // NOSE
  const noseG=rg(2,-1,0,3,0,5);noseG.addColorStop(0,'#ffb3c8');noseG.addColorStop(1,'#ff8fab');
  C.fillStyle=noseG;C.beginPath();C.ellipse(2,1,5.5,3.8,0,0,Math.PI*2);C.fill();
  C.fillStyle='rgba(255,200,220,.5)';C.beginPath();C.ellipse(0,-1,3,2,-.2,0,Math.PI*2);C.fill();

  // MOUTH
  C.strokeStyle='#ff9bad';C.lineWidth=2.2;C.lineCap='round';
  C.beginPath();
  if(jMouth){
    // Open happy mouth
    C.arc(2,8,8,0,Math.PI);
    C.fillStyle='rgba(200,50,80,.6)';C.arc(2,8,7,0,Math.PI);C.fill();
    C.beginPath();C.arc(2,8,8,0,Math.PI);
  } else {
    C.moveTo(-8,7);C.quadraticCurveTo(2,14,12,7);
  }
  C.stroke();

  // WHISKERS — 3 per side, slight droop
  C.strokeStyle='rgba(210,210,210,.7)';C.lineWidth=1.6;C.lineCap='round';
  [[-30,-1],[-30,4],[-30,9]].forEach(([wx,wy])=>{C.beginPath();C.moveTo(wx,wy);C.quadraticCurveTo(-20,wy+1,-8,wy);C.stroke();});
  [[34,-1],[34,4],[34,9]].forEach(([wx,wy])=>{C.beginPath();C.moveTo(wx,wy);C.quadraticCurveTo(24,wy+1,12,wy);C.stroke();});
  // Whisker shine
  C.strokeStyle='rgba(255,255,255,.2)';C.lineWidth=.8;
  C.beginPath();C.moveTo(-30,-1);C.lineTo(-8,-1);C.stroke();
  C.beginPath();C.moveTo(34,-1);C.lineTo(12,-1);C.stroke();

  C.restore(); // head
  C.restore(); // jared
}

// ═══════════════ ORDERS & GAME LOGIC ═══════════════
function spawnOrder(){
  SFX.resume();if(G.orders.length>=4||!G.started)return;SFX.click();
  const rec=RECIPES[Math.floor(Math.random()*RECIPES.length)];
  const ord={id:G.oid++,rec,timeLeft:rec.time,maxTime:rec.time,cust:CUSTS[Math.floor(Math.random()*CUSTS.length)],status:'waiting'};
  G.orders.push(ord);renderOrders();
  G.timers[ord.id]=setInterval(()=>{const o=G.orders.find(x=>x.id===ord.id);if(!o||o.status!=='waiting'){clearInterval(G.timers[ord.id]);return;}o.timeLeft-=.1;if(o.timeLeft<=0)failOrder(ord.id);else updateOT(ord.id);},100);
}
function updateOT(id){const el=$('tmr-'+id),te=$('ttime-'+id),o=G.orders.find(x=>x.id===id);if(!el||!o)return;const p=(o.timeLeft/o.maxTime)*100;el.style.width=p+'%';el.style.background=p>55?'#5CB85C':p>25?'#FFB300':'#E8453C';if(te)te.textContent=Math.ceil(o.timeLeft)+'s';}
function failOrder(id){clearInterval(G.timers[id]);const o=G.orders.find(x=>x.id===id);if(!o)return;G.combo=1;updateHUD();showSpeech('¡Ese pedido se fue.');if(G.active&&G.active.id===id){stopCurAnim();G.active=null;G.step=0;G.busy=false;resetBtn();}G.orders=G.orders.filter(x=>x.id!==id);renderOrders();setTimeout(()=>spawnOrder(),2800);}
function renderOrders(){
  const panel=$('ordersPanel');panel.innerHTML='';
  if(!G.orders.length){const d=document.createElement('div');d.style.cssText='color:rgba(255,255,200,.38);font-size:11px;font-weight:700;padding:8px 4px;';d.textContent='Sin pedidos...';panel.appendChild(d);return;}
  G.orders.forEach(o=>{const p=(o.timeLeft/o.maxTime)*100,bc=p>55?'#5CB85C':p>25?'#FFB300':'#E8453C';const d=document.createElement('div');d.className='ocard'+(G.active&&G.active.id===o.id?' sel':'');d.id='oc-'+o.id;d.innerHTML=`<div class="orow"><span class="ocust">${o.cust}</span><div class="oinfo"><div class="oname">${o.rec.emoji} ${o.rec.name}</div><div class="tbg"><div class="tb" id="tmr-${o.id}" style="width:${p}%;background:${bc};"></div></div><div class="ttime" id="ttime-${o.id}">${Math.ceil(o.timeLeft)}s</div></div></div>`;d.addEventListener('click',()=>selectOrder(o.id));panel.appendChild(d);});
}
function selectOrder(id){if(G.busy)return;const o=G.orders.find(x=>x.id===id&&x.status==='waiting');if(!o)return;SFX.click();G.active=o;G.step=0;renderOrders();renderSteps();showSpeech('¡Vamos a hacer '+o.rec.name+'! 💕');setBtn(o.rec.steps[0].btn,'cook');animState=null;}
function renderSteps(){const p=$('stepPanel');if(!G.active){p.innerHTML='';return;}let h='<div class="scard">';if(G.combo>1)h+=`<div class="ctag">COMBO x${G.combo}! 🔥</div>`;h+=`<div class="stitle">${G.active.rec.emoji} ${G.active.rec.name}</div>`;G.active.rec.steps.forEach((s,i)=>{h+=`<div class="sitem ${i===G.step?'cur':i<G.step?'done':''}"><div class="snum">${i<G.step?'✓':i+1}</div><div class="stxt">${s.t}</div></div>`;});h+='</div>';p.innerHTML=h;}
function setBtn(t,c){const b=$('actionBtn');b.className=c;b.textContent=t;}
function resetBtn(){$('progWrap').style.display='none';$('stepPanel').innerHTML='';$('phaseLbl').classList.remove('show');setBtn('+ Nuevo Pedido','neword');}
function stopCurAnim(){animRunning=false;animState=null;}

function handleAction(){
  if(!G.active||G.busy)return;SFX.resume();SFX.click();
  const rec=G.active.rec;
  if(G.step<rec.steps.length){
    const step=rec.steps[G.step];G.busy=true;
    showSpeech(STEPM[Math.floor(Math.random()*STEPM.length)]);
    setBtn('Cocinando...','idle');$('progWrap').style.display='block';$('pbLbl').textContent=step.t;
    stopCurAnim();
    const dur={mix:5200,whisk:4800,oven:6200,fold:4500,deco:6000}[step.type]||5000;
    animDur=dur;animStart=performance.now();animRunning=true;animT2=0;
    if(step.type==='mix'){SFX.mixing(dur/1000);initMix(step);}
    else if(step.type==='whisk'){SFX.whisk(dur/1000);initWhisk(step);}
    else if(step.type==='oven'){SFX.oven(dur/1000);initOven(rec);}
    else if(step.type==='fold'){SFX.mixing(dur/1000);initFold();}
    else if(step.type==='deco'){SFX.mixing(dur/1000);initDeco(rec);}
    animDone=()=>{G.step++;G.busy=false;$('progWrap').style.display='none';spawnDomEmojis(rec.emoji,4);spawnDomEmojis('⭐',3);renderSteps();if(G.step<rec.steps.length){setBtn(rec.steps[G.step].btn,'cook');}else{setBtn('¡Servir '+rec.emoji+'!','serve');showSpeech('¡Listo! ¡Sírvelo! 🍽️');}};
  }
}
function serveOrder(){
  if(!G.active)return;SFX.resume();SFX.click();clearInterval(G.timers[G.active.id]);
  const o=G.active,tp=o.timeLeft/o.maxTime;
  const pts=Math.round((o.rec.pts+Math.floor(tp*85))*G.combo);
  G.score+=pts;G.served++;G.combo=Math.min(G.combo+1,8);G.xp+=pts;
  if(G.xp>=G.level*130){G.xp-=G.level*130;G.level++;showSpeech('¡NIVEL '+G.level+'! ¡Increíble! 🏆💕');}
  updateHUD();SFX.success();
  $('mEj').textContent=o.rec.emoji;$('mTit').textContent=tp>.65?'¡PERFECTO! ✨':tp>.35?'¡INCREÍBLE! 🌟':'¡LOGRADO! 💪';
  $('mMsg').textContent=LOVE[Math.floor(Math.random()*LOVE.length)];$('mPts').textContent='+'+pts.toLocaleString()+' pts';
  setTimeout(()=>$('modOverlay').classList.add('show'),420);
  for(let i=0;i<4;i++)setTimeout(()=>{spawnDomEmojis(o.rec.emoji,6);spawnDomEmojis('💕',5);spawnDomEmojis('⭐',7);},i*160);
  confetti(W/2,H/2);
  G.orders=G.orders.filter(x=>x.id!==o.id);G.active=null;G.step=0;G.busy=false;animState=null;renderOrders();renderSteps();resetBtn();setTimeout(()=>spawnOrder(),2000);
}
function updateHUD(){$('scoreD').textContent=G.score.toLocaleString();$('servD').textContent=G.served;$('lvlD').textContent=LVL[Math.min(G.level-1,LVL.length-1)];$('xpBar').style.width=Math.min((G.xp/(G.level*130))*100,100)+'%';if(G.active)renderSteps();}
let _spTO=null;
function showSpeech(m){const el=$('speech');$('speechWrap').style.opacity=0;clearTimeout(_spTO);setTimeout(()=>{el.textContent=m;$('speechWrap').style.opacity=1;},155);_spTO=setTimeout(()=>$('speechWrap').style.opacity=0,5500);}
function spawnDomEmojis(emoji,n){for(let i=0;i<n;i++)setTimeout(()=>{const p2=document.createElement('div');p2.className='dp';p2.textContent=emoji;const x=Math.random()*W,y=H*.3+Math.random()*H*.4;p2.style.left=x+'px';p2.style.top=y+'px';p2.style.setProperty('--tx',(Math.random()-.5)*220+'px');p2.style.setProperty('--ty',(-Math.random()*160-55)+'px');p2.style.setProperty('--tr',(Math.random()-.5)*400+'deg');document.body.appendChild(p2);setTimeout(()=>p2.remove(),1700);},i*85);}

// ═══════════════ MAIN LOOP ═══════════════
let lastT2=0,animT2=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=(now-lastT2)/1000;lastT2=now;
  jT+=dt*1.5;jBlinkT=Math.max(0,jBlinkT-dt*6);if(jBlinkT<=0&&Math.random()<.008)jBlinkT=1;jMouth=G.busy&&Math.sin(jT*4)>.25;
  updateParticles();
  // Anim progress
  let ap=0;
  if(animRunning){ap=Math.min((now-animStart)/animDur,1);$('pbFill').style.width=(ap*100).toFixed(1)+'%';if(animState){if(animState.kind==='mix')updateMix(ap);else if(animState.kind==='whisk')updateWhisk(ap);else if(animState.kind==='oven')updateOven(ap);else if(animState.kind==='fold')updateFold(ap);else if(animState.kind==='deco')updateDeco(ap);}if(ap>=1){animRunning=false;animState=null;SFX.stepDone();if(animDone){const f=animDone;animDone=null;f();}}}
  // Draw
  C.clearRect(0,0,W,H);
  drawKitchen();
  if(animState){if(animState.kind==='mix')drawMix(ap);else if(animState.kind==='whisk')drawWhisk(ap);else if(animState.kind==='oven')drawOven(ap);else if(animState.kind==='fold')drawFold(ap);else if(animState.kind==='deco')drawDeco(ap);}
  drawParticles();
  // Jared
  const jx=W*.84,jy=H*.74+Math.sin(jT)*(H*.014);
  drawJared(jx,jy,Math.min(W/900,H/650)*1.1);
  // Vignette
  C.fillStyle=rg(W/2,H/2,W*.18,W*.72,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.52)']]);
  C.fillRect(0,0,W,H);
}

function startGame(){G.started=true;$('startScreen').style.display='none';SFX.init();SFX.bgm();showSpeech('¡Vamos a hornear juntos! ¡Te amo! 💕');setBtn('+ Nuevo Pedido','neword');setTimeout(()=>spawnOrder(),700);setTimeout(()=>spawnOrder(),2200);}

window.addEventListener('load',()=>{
  setTimeout(()=>{const ld=$('loader');ld.style.transition='opacity .6s';ld.style.opacity=0;setTimeout(()=>ld.style.display='none',650);},2200);
  $('startBtn').addEventListener('click',startGame);
  $('modalClose').addEventListener('click',()=>{$('modOverlay').classList.remove('show');SFX.click();});
  $('audioBtn').addEventListener('click',()=>{const on=SFX.toggle();$('audioBtn').textContent=on?'🔊':'🔇';});
  $('newBtn').addEventListener('click',spawnOrder);
  $('actionBtn').addEventListener('click',()=>{SFX.resume();const cl=$('actionBtn').className;if(cl.includes('cook'))handleAction();else if(cl.includes('serve'))serveOrder();else if(cl.includes('neword'))spawnOrder();});
  canvas.addEventListener('click',e=>{if(!G.started||G.busy)return;const jx=W*.84,jy=H*.7;const dx=e.clientX-jx,dy=e.clientY-jy;if(Math.sqrt(dx*dx+dy*dy)<W*.12){const ms=['¡Te amo! 😻','¡Soy el feliz! 💖'];showSpeech(ms[Math.floor(Math.random()*ms.length)]);spawnDomEmojis('💕',6);spawnDomEmojis('⭐',4);for(let i=0;i<12;i++){const a=i/12*Math.PI*2;addP(e.clientX,e.clientY,Math.cos(a)*rand(3,7),Math.sin(a)*rand(3,7)-3,'#ff80ab',rand(3,6),rand(.6,.9),.1);}}});
  setInterval(()=>{if(G.started&&G.orders.length<4&&Math.random()<.28)spawnOrder();},7000);
  loop(0);
});
</script>
